; PlatformIO Project Configuration File

[platformio]
default_envs = shaper

[common]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=0

; ----- Rainbow LED demo (SW3/SW4 gated) -----
[env:rainbow]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps = fastled/FastLED@^3.7.0
build_src_filter = +<../test/sketches/rainbow.cpp>

; ----- Board self-test (LED/switches/IMU/OLED/GPS/mic) -----
[env:selftest]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps =
    fastled/FastLED@^3.7.0
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
build_src_filter = +<../test/sketches/board_self_test.cpp>

; ----- Input-shaper accelerometer capture (BMI270 -> USB CSV) -----
[env:shaper]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps =
    fastled/FastLED@^3.7.0
    https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library.git
build_src_filter = +<../test/sketches/input_shaper_capture.cpp>
