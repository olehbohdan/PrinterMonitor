# =============================================================================
# printer_monitor.cfg
#
# Macros that cooperate with the PrinterMonitor ESP32-C3 device for wireless
# input-shaper auto-tuning.
#
# Workflow:
#   1. User mounts PrinterMonitor PCB on toolhead (X test) or bed (Y test).
#   2. PCB long-press fires HA automation -> Moonraker REST -> macro below.
#   3. Macro emits "PM_SHAPER_BEGIN AXIS=<X|Y>", chirps the axis with growing
#      amplitudes covering ~5..120 Hz, then emits "PM_SHAPER_END".
#      The PCB watches an HA helper (input_boolean.printer_monitor_shaper_capture)
#      that the HA automation flips on/off around the macro call.
#   4. PCB captures BMI270 FIFO, computes PSD on device, publishes via HA event.
#   5. HA shell_command runs the off-device shaper-search Python and calls
#      PM_SHAPER_APPLY with the chosen shaper type / frequency.
#
# Add to printer.cfg:
#     [include printer_monitor.cfg]
# =============================================================================

[save_variables]
filename: ~/printer_data/config/save_variables.cfg


# -----------------------------------------------------------------------------
# Chirp parameters
#   - START_FREQ / END_FREQ:  Hz range the chirp covers
#   - ACCEL: peak acceleration during chirp (mm/s^2)
#   - DWELL: number of full cycles per frequency step (longer = better SNR)
# Defaults are sized for max_velocity=300, max_accel=6000, ~250 mm bed.
# -----------------------------------------------------------------------------

[gcode_macro PM_SHAPER_SWEEP_X]
description: Chirp X-axis for PrinterMonitor BMI270 capture.
gcode:
    # Default chirp band sized to fit inside the ESP's ~2.5 s capture
    # window (4096 samples @ 1.6 kHz).  ln(80/15)*1 = 1.4 s of chirp,
    # well under the buffer.  Covers the typical Voron / Bambu / class-pcb
    # resonance range (30-60 Hz) with margin on both sides.  Override via
    # START_FREQ / END_FREQ / DWELL params if you need a wider sweep.
    {% set START_FREQ = params.START_FREQ|default(15)|float %}
    {% set END_FREQ   = params.END_FREQ|default(80)|float %}
    {% set ACCEL      = params.ACCEL|default(6000)|int %}
    {% set DWELL      = params.DWELL|default(1)|int %}
    {% set CENTER_X   = params.CENTER_X|default(124)|float %}
    {% set CENTER_Y   = params.CENTER_Y|default(115)|float %}
    {% set old_accel  = printer.toolhead.max_accel %}
    {% set old_atd    = printer.toolhead.max_accel_to_decel|default(old_accel) %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 X{CENTER_X} Y{CENTER_Y} F6000
    M400
    SET_VELOCITY_LIMIT ACCEL={ACCEL} ACCEL_TO_DECEL={ACCEL}
    M118 PM_SHAPER_BEGIN AXIS=X FREQS={START_FREQ}-{END_FREQ} ACCEL={ACCEL}

    {% for f10 in range((START_FREQ * 10)|int, (END_FREQ * 10)|int + 1, 10) %}
        {% set f = f10 / 10.0 %}
        # peak displacement amp (mm) for given accel and freq:
        # x = a / (2*pi*f)^2 ; clamp to printer-safe range
        {% set amp_mm = ACCEL / ((6.2831853 * f) * (6.2831853 * f)) * 1000.0 %}
        {% if amp_mm < 0.20 %}{% set amp_mm = 0.20 %}{% endif %}
        {% if amp_mm > 25.0 %}{% set amp_mm = 25.0 %}{% endif %}
        # speed for full back-and-forth cycle at freq f
        {% set vel_mm_s = 4.0 * amp_mm * f %}
        {% set vel_mm_min = vel_mm_s * 60.0 %}
        {% if vel_mm_min < 60 %}{% set vel_mm_min = 60 %}{% endif %}
        {% if vel_mm_min > 18000 %}{% set vel_mm_min = 18000 %}{% endif %}
        {% for _ in range(DWELL) %}
            G0 X{CENTER_X + amp_mm} F{vel_mm_min}
            G0 X{CENTER_X - amp_mm} F{vel_mm_min}
        {% endfor %}
    {% endfor %}

    G0 X{CENTER_X} Y{CENTER_Y} F6000
    M400
    M118 PM_SHAPER_END AXIS=X
    SET_VELOCITY_LIMIT ACCEL={old_accel} ACCEL_TO_DECEL={old_atd}


[gcode_macro PM_SHAPER_SWEEP_Y]
description: Chirp Y-axis for PrinterMonitor BMI270 capture.
gcode:
    # See notes on PM_SHAPER_SWEEP_X for default band rationale.
    {% set START_FREQ = params.START_FREQ|default(15)|float %}
    {% set END_FREQ   = params.END_FREQ|default(80)|float %}
    {% set ACCEL      = params.ACCEL|default(6000)|int %}
    {% set DWELL      = params.DWELL|default(1)|int %}
    {% set CENTER_X   = params.CENTER_X|default(124)|float %}
    {% set CENTER_Y   = params.CENTER_Y|default(115)|float %}
    # Z_SAFE lifts the toolhead well clear of the build plate before the
    # Y chirp, since for Y tuning the PrinterMonitor PCB lies flat on the
    # bed and the nozzle would otherwise crash into it.
    {% set Z_SAFE     = params.Z_SAFE|default(80)|float %}
    {% set old_accel  = printer.toolhead.max_accel %}
    {% set old_atd    = printer.toolhead.max_accel_to_decel|default(old_accel) %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 Z{Z_SAFE} F1500
    G0 X{CENTER_X} Y{CENTER_Y} F6000
    M400
    SET_VELOCITY_LIMIT ACCEL={ACCEL} ACCEL_TO_DECEL={ACCEL}
    M118 PM_SHAPER_BEGIN AXIS=Y FREQS={START_FREQ}-{END_FREQ} ACCEL={ACCEL}

    {% for f10 in range((START_FREQ * 10)|int, (END_FREQ * 10)|int + 1, 10) %}
        {% set f = f10 / 10.0 %}
        {% set amp_mm = ACCEL / ((6.2831853 * f) * (6.2831853 * f)) * 1000.0 %}
        {% if amp_mm < 0.20 %}{% set amp_mm = 0.20 %}{% endif %}
        {% if amp_mm > 25.0 %}{% set amp_mm = 25.0 %}{% endif %}
        {% set vel_mm_s = 4.0 * amp_mm * f %}
        {% set vel_mm_min = vel_mm_s * 60.0 %}
        {% if vel_mm_min < 60 %}{% set vel_mm_min = 60 %}{% endif %}
        {% if vel_mm_min > 18000 %}{% set vel_mm_min = 18000 %}{% endif %}
        {% for _ in range(DWELL) %}
            G0 Y{CENTER_Y + amp_mm} F{vel_mm_min}
            G0 Y{CENTER_Y - amp_mm} F{vel_mm_min}
        {% endfor %}
    {% endfor %}

    G0 X{CENTER_X} Y{CENTER_Y} F6000
    M400
    M118 PM_SHAPER_END AXIS=Y
    SET_VELOCITY_LIMIT ACCEL={old_accel} ACCEL_TO_DECEL={old_atd}


# -----------------------------------------------------------------------------
# Apply shaper values chosen off-device (called by the HA shell_command).
# Persists in save_variables.cfg so values survive Klipper restarts.
# Does NOT call SAVE_CONFIG (that requires firmware restart) - the
# [input_shaper] section in printer.cfg should reference the saved variables
# OR you can run SAVE_CONFIG manually after verifying the values look sane.
# -----------------------------------------------------------------------------
[gcode_macro PM_SHAPER_APPLY]
description: Apply input-shaper values reported by PrinterMonitor.
gcode:
    {% set TYPE_X = params.TYPE_X|default("mzv") %}
    {% set FREQ_X = params.FREQ_X|default(0)|float %}
    {% set TYPE_Y = params.TYPE_Y|default("mzv") %}
    {% set FREQ_Y = params.FREQ_Y|default(0)|float %}

    {% if FREQ_X > 0 %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={TYPE_X} SHAPER_FREQ_X={FREQ_X}
        SAVE_VARIABLE VARIABLE=pm_shaper_type_x VALUE='"{TYPE_X}"'
        SAVE_VARIABLE VARIABLE=pm_shaper_freq_x VALUE={FREQ_X}
        M118 PM_SHAPER_APPLIED AXIS=X TYPE={TYPE_X} FREQ={FREQ_X}
    {% endif %}
    {% if FREQ_Y > 0 %}
        SET_INPUT_SHAPER SHAPER_TYPE_Y={TYPE_Y} SHAPER_FREQ_Y={FREQ_Y}
        SAVE_VARIABLE VARIABLE=pm_shaper_type_y VALUE='"{TYPE_Y}"'
        SAVE_VARIABLE VARIABLE=pm_shaper_freq_y VALUE={FREQ_Y}
        M118 PM_SHAPER_APPLIED AXIS=Y TYPE={TYPE_Y} FREQ={FREQ_Y}
    {% endif %}


# -----------------------------------------------------------------------------
# Restore PrinterMonitor-tuned values at startup (call from PRINT_START or
# a delayed_gcode at boot).
# -----------------------------------------------------------------------------
[gcode_macro PM_SHAPER_RESTORE]
description: Re-apply last PrinterMonitor-tuned shaper values from save_variables.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tx = svv.pm_shaper_type_x|default(none) %}
    {% set fx = svv.pm_shaper_freq_x|default(0)|float %}
    {% set ty = svv.pm_shaper_type_y|default(none) %}
    {% set fy = svv.pm_shaper_freq_y|default(0)|float %}
    {% if tx and fx > 0 %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={tx} SHAPER_FREQ_X={fx}
    {% endif %}
    {% if ty and fy > 0 %}
        SET_INPUT_SHAPER SHAPER_TYPE_Y={ty} SHAPER_FREQ_Y={fy}
    {% endif %}


[delayed_gcode pm_restore_at_boot]
initial_duration: 2.0
gcode:
    PM_SHAPER_RESTORE


# =============================================================================
# Klipper-initiated tuning
#
# These macros let you start the whole capture pipeline straight from the
# Klipper console / a print_start sequence / the Mainsail-Fluidd UI, with
# NO physical button press and NO HA-side trigger. Klipper is the
# orchestrator: it arms the ESP, then chirps locally; HA only post-processes
# the PSD that the ESP fires back.
#
# Requirements (one-time host setup):
#   1. Install the `gcode_shell_command` extra (KIAUH menu 4 -> "Install
#      gcode_shell_command" or copy from
#      https://github.com/dw-0/kiauh/blob/master/resources/gcode_shell_command.py
#      into ~/klipper/klippy/extras/).
#   2. Create a Home Assistant long-lived access token
#      (HA -> profile -> Security -> Long-lived access tokens) and stash it
#      so the chirp side can curl HA's REST API:
#          mkdir -p ~/printer_data/config/printer_monitor
#          echo "HA_TOKEN=eyJhbGciOi..."   >  ~/printer_data/config/printer_monitor/env
#          echo "HA_URL=http://192.168.1.96:8123" >> ~/printer_data/config/printer_monitor/env
#          chmod 600 ~/printer_data/config/printer_monitor/env
#   3. Drop the helper script:
#          cat > ~/printer_data/config/printer_monitor/arm.sh <<'EOF'
#          #!/bin/sh
#          set -eu
#          . "$(dirname "$0")/env"
#          curl -fsS -m 5 -X POST \
#               -H "Authorization: Bearer $HA_TOKEN" \
#               -H "Content-Type: application/json" \
#               -d "{\"axis\":\"$1\"}" \
#               "$HA_URL/api/services/esphome/printer_monitor_arm_shaper_capture" >/dev/null
#          EOF
#          chmod 755 ~/printer_data/config/printer_monitor/arm.sh
#   4. Restart Klipper.
#
# Then `PM_TUNE_X` from the gcode console runs the whole flow.
# =============================================================================

[gcode_shell_command pm_arm_x]
command: /home/oleh/printer_data/config/printer_monitor/arm.sh X
timeout: 5.0
verbose: True

[gcode_shell_command pm_arm_y]
command: /home/oleh/printer_data/config/printer_monitor/arm.sh Y
timeout: 5.0
verbose: True


[gcode_macro PM_TUNE_X]
description: Arm PrinterMonitor capture (via HA) then chirp X-axis.
gcode:
    M118 PM_TUNE: arming ESP for X
    RUN_SHELL_COMMAND CMD=pm_arm_x
    # Brief delay so the ESP service round-trip + BMI270 FIFO arm completes
    # before the toolhead starts moving. ~250 ms is plenty over LAN.
    G4 P250
    PM_SHAPER_SWEEP_X{% for k, v in params.items() %} {k}={v}{% endfor %}


[gcode_macro PM_TUNE_Y]
description: Arm PrinterMonitor capture (via HA) then chirp Y-axis.
gcode:
    M118 PM_TUNE: arming ESP for Y
    RUN_SHELL_COMMAND CMD=pm_arm_y
    G4 P250
    PM_SHAPER_SWEEP_Y{% for k, v in params.items() %} {k}={v}{% endfor %}


[gcode_macro PM_TUNE_BOTH]
description: Run PM_TUNE_X then PM_TUNE_Y back-to-back.
gcode:
    PM_TUNE_X{% for k, v in params.items() %} {k}={v}{% endfor %}
    # Give HA time to run pm_apply_shaper.py for X before kicking Y
    G4 P3000
    PM_TUNE_Y{% for k, v in params.items() %} {k}={v}{% endfor %}


# =============================================================================
# USB-streaming shaper tuning (preferred path - bypasses HA/wifi entirely)
#
# Plug the PrinterMonitor PCB into the Klipper Pi over USB.  It enumerates
# as /dev/ttyACM* and the firmware streams raw 1.6 kHz BMI270 samples on
# demand.  Sample timing is deterministic (the chip itself paces the
# stream), matching native ADXL345 accuracy.
#
# Chirp generation: we use Klipper's built-in TEST_RESONANCES, which
# emits a fast MCU-side exponential chirp.  Because TEST_RESONANCES
# requires an accel_chip to register, we ship a no-op proxy plugin
# (pm_dummy_accel) so the chirp runs without a real accelerometer wired
# to the printer mainboard.
#
# One-time host setup:
#   1. Drop pm_usb_capture.py into ~/printer_data/config/printer_monitor/.
#   2. Drop pm_dummy_accel.py into ~/klipper/klippy/extras/.
#   3. Make sure pyserial is installed in the Klippy venv:
#          ~/klippy-env/bin/pip install pyserial
#   4. Restart Klipper.
#
# Run from console:
#   PM_USB_TUNE_X     - tune X with USB capture, no shaper apply
#   PM_USB_TUNE_X CALIBRATE=1   - run calibrate_shaper.py and print
#                                 recommended shaper to console
#   Optional params:
#     FREQ_START=20  FREQ_END=80   HZ_PER_SEC=2
#     ACCEL_PER_HZ=75              (Klipper default 75)
# =============================================================================

[pm_dummy_accel pm_chip]
# No-op accel chip required by Klipper's [resonance_tester].  Real
# samples come from PrinterMonitor over USB; this just satisfies the
# config + lifecycle interface.

[resonance_tester]
accel_chip: pm_dummy_accel pm_chip
# Bed centre - adjust if your bed is not 248x230.  This is where the
# toolhead is parked when TEST_RESONANCES runs.
probe_points:
    124, 115, 20
# Conservative chirp shape - you can override per-call via TEST_RESONANCES
# AXIS=X FREQ_START=... FREQ_END=... HZ_PER_SEC=...
min_freq: 5
max_freq: 100
accel_per_hz: 75
hz_per_sec: 2     # max allowed by Klipper; 1 Hz / 0.5 s = 2 s per Hz step

# One parameterized capture command - macro passes "AXIS DURATION_S"
# via PARAMS so a single shell_command serves both axes and any duration.
# Uses a PID file (/tmp/pm_usb_capture.pid) to terminate any prior
# pm_usb_capture.py from a previous aborted run; we deliberately do NOT
# use `pkill -f pm_usb_capture.py` because `bash -c` includes the literal
# script in its own argv, so pkill -f would match (and kill) the very
# bash process running this command.
[gcode_shell_command pm_usb_capture]
command: bash -c 'AX="$1"; DUR="$2"; CSV="/tmp/pm_resonances_${AX,,}.csv"; LOG="/tmp/pm_capture_${AX,,}.log"; PIDF="/tmp/pm_usb_capture.pid"; if [ -f "$PIDF" ]; then OP=$(cat "$PIDF" 2>/dev/null); if [ -n "$OP" ] && kill -0 "$OP" 2>/dev/null; then kill "$OP" 2>/dev/null; sleep 0.3; kill -9 "$OP" 2>/dev/null; fi; fi; rm -f "$PIDF"; rm -f "$CSV"; : >"$LOG"; setsid ~/klippy-env/bin/python ~/printer_data/config/printer_monitor/pm_usb_capture.py --axis "$AX" --duration "$DUR" --out "$CSV" >"$LOG" 2>&1 & echo $! >"$PIDF"; disown' pm_usb_capture
timeout: 5.0
verbose: True

[gcode_shell_command pm_usb_show_log]
command: bash -c 'cat "/tmp/pm_capture_${1,,}.log" 2>/dev/null | tail -40' pm_usb_show_log
timeout: 5.0
verbose: True

[gcode_shell_command pm_usb_calibrate]
command: bash -c '/usr/bin/python3 ~/klipper/scripts/calibrate_shaper.py "/tmp/pm_resonances_${1,,}.csv"' pm_usb_calibrate
timeout: 60.0
verbose: True

# High-precision picker: uses Klipper's shaper_calibrate library directly
# at a fine 0.05 Hz frequency grid (vs 0.2 Hz default), rejects band-edge
# fits (within 2 Hz of FREQ_START / FREQ_END) and over-smoothed shapers
# (>0.20 by default; override via env PM_MAX_SMOOTHING), and includes a
# parabolically-interpolated PSD peak measurement as ground-truth.
# Args: AXIS FREQ_START FREQ_END
# Emits: PM_USB_RESULT AXIS=X shaper_type_x=ei shaper_freq_x=53.15 vib=3.74% smooth=0.117 peak=48.16Hz Q=141.0
[gcode_shell_command pm_usb_recommend]
command: /usr/bin/python3 /home/oleh/printer_data/config/printer_monitor/pm_usb_recommend.py
timeout: 60.0
verbose: True


[gcode_macro PM_USB_TUNE_X]
description: TEST_RESONANCES chirp X with USB BMI270 capture; optional calibrate.
gcode:
    {% set CALIBRATE  = params.CALIBRATE|default(1)|int %}
    {% set FREQ_START = params.FREQ_START|default(30)|float %}
    {% set FREQ_END   = params.FREQ_END|default(70)|float %}
    {% set HZ_PER_SEC = params.HZ_PER_SEC|default(2)|float %}
    {% set ACCEL_PER_HZ = params.ACCEL_PER_HZ|default(150)|float %}
    # Capture window = chirp duration + 2 s slack for setup/wind-down.
    {% set DUR = ((FREQ_END - FREQ_START) / HZ_PER_SEC + 2.0)|round(1) %}
    M118 PM_USB_TUNE_X: chirp {FREQ_START}-{FREQ_END} Hz @ {HZ_PER_SEC} Hz/s, capture {DUR}s
    RUN_SHELL_COMMAND CMD=pm_usb_capture PARAMS="X {DUR}"
    # Wait for python to PING/PONG/START handshake before moving.
    G4 P500
    TEST_RESONANCES AXIS=X OUTPUT=raw_data FREQ_START={FREQ_START} FREQ_END={FREQ_END} HZ_PER_SEC={HZ_PER_SEC} ACCEL_PER_HZ={ACCEL_PER_HZ}
    # Wait for python to flush + write CSV.
    G4 P1500
    M118 PM_USB_TUNE_X: capture log -->
    RUN_SHELL_COMMAND CMD=pm_usb_show_log PARAMS="X"
    {% if CALIBRATE %}
        M118 PM_USB_TUNE_X: running calibrate_shaper.py
        RUN_SHELL_COMMAND CMD=pm_usb_calibrate PARAMS="X"
        RUN_SHELL_COMMAND CMD=pm_usb_recommend PARAMS="X {FREQ_START} {FREQ_END}"
    {% endif %}


[gcode_macro PM_USB_TUNE_Y]
description: TEST_RESONANCES chirp Y with USB BMI270 capture; optional calibrate.
gcode:
    {% set CALIBRATE  = params.CALIBRATE|default(1)|int %}
    {% set FREQ_START = params.FREQ_START|default(30)|float %}
    {% set FREQ_END   = params.FREQ_END|default(70)|float %}
    {% set HZ_PER_SEC = params.HZ_PER_SEC|default(2)|float %}
    {% set ACCEL_PER_HZ = params.ACCEL_PER_HZ|default(150)|float %}
    # For Y tuning the PCB sits flat on the build plate, so we override
    # the resonance test point to a safe Z (default 80 mm) - well clear
    # of any toolhead/nozzle. Override via Z_SAFE=... if your printer is
    # short or you have a known-low max_z.
    {% set Z_SAFE     = params.Z_SAFE|default(80)|float %}
    {% set CENTER_X   = params.CENTER_X|default(124)|float %}
    {% set CENTER_Y   = params.CENTER_Y|default(115)|float %}
    {% set DUR = ((FREQ_END - FREQ_START) / HZ_PER_SEC + 2.0)|round(1) %}
    M118 PM_USB_TUNE_Y: chirp {FREQ_START}-{FREQ_END} Hz @ {HZ_PER_SEC} Hz/s, capture {DUR}s
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Lift before TEST_RESONANCES moves to its probe_point so the nozzle
    # never sweeps low across a board mounted on the bed.
    G90
    G0 Z{Z_SAFE} F1500
    M400
    RUN_SHELL_COMMAND CMD=pm_usb_capture PARAMS="Y {DUR}"
    G4 P500
    TEST_RESONANCES AXIS=Y OUTPUT=raw_data FREQ_START={FREQ_START} FREQ_END={FREQ_END} HZ_PER_SEC={HZ_PER_SEC} ACCEL_PER_HZ={ACCEL_PER_HZ} POINT={CENTER_X},{CENTER_Y},{Z_SAFE}
    G4 P1500
    M118 PM_USB_TUNE_Y: capture log -->
    RUN_SHELL_COMMAND CMD=pm_usb_show_log PARAMS="Y"
    {% if CALIBRATE %}
        M118 PM_USB_TUNE_Y: running calibrate_shaper.py
        RUN_SHELL_COMMAND CMD=pm_usb_calibrate PARAMS="Y"
        RUN_SHELL_COMMAND CMD=pm_usb_recommend PARAMS="Y {FREQ_START} {FREQ_END}"
    {% endif %}


[gcode_macro PM_USB_TUNE_BOTH]
description: PM_USB_TUNE_X then PM_USB_TUNE_Y, optionally calibrating both.
gcode:
    PM_USB_TUNE_X{% for k, v in params.items() %} {k}={v}{% endfor %}
    G4 P500
    PM_USB_TUNE_Y{% for k, v in params.items() %} {k}={v}{% endfor %}

