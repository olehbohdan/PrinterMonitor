[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2F000F001850425938323120-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 6000
max_z_velocity: 15
max_z_accel: 200

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[force_move]
enable_force_move: True

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404109E9F1C-if00

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 1.0
i2c_mcu: eddy
i2c_bus: i2c0f
# Measure your physical probe-to-nozzle offsets and set below.
# Guide: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-x-and-y-offsets
# Positive X = probe is to the right of nozzle, negative = left.
# Positive Y = probe is in front of nozzle, negative = behind.
x_offset: -47 #-47
y_offset: -5

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

[safe_z_home]
# With x_offset=0, y_offset=0 the probe IS the nozzle. Set to bed center.
# Once you measure and set real offsets, adjust to:
#   home_xy_position: (bed_center_x - x_offset), (bed_center_y - y_offset)
# Position = bed_center - offset, so nozzle lands at bed center (125, 117.5)
home_xy_position: 172, 122.5
z_hop: 10
z_hop_speed: 15
speed: 150

[bed_mesh]
speed: 100
horizontal_move_z: 2
mesh_min: 15, 45
mesh_max: 200, 200
probe_count: 5, 5
algorithm: bicubic
mesh_pps: 0, 0
fade_start: 1
fade_end: 10
fade_target: 0
adaptive_margin: 5

[screws_tilt_adjust]
screw1: 70.5,37.5
screw1_name: front left screw
screw2: 245,37.5
screw2_name: front right screw
screw3: 245,207.5
screw3_name: rear right screw
screw4: 70.5,207.5
screw4_name: rear left screw
horizontal_move_z: 5
speed: 100
screw_thread: CW-M4

[firmware_retraction]
retract_length: 0.4
# The length of filament (in mm) to retract when G10 is activated,
# and to unretract when G11 is activated (but see
# unretract_extra_length below). The default is 0 mm.
retract_speed: 40
# The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length:0.0
# The length (in mm) of *additional* filament to add when
# unretracting.
unretract_speed: 35
# The speed of unretraction, in mm/s. The default is 10 mm/s.

[exclude_object]

[include timelapse.cfg]
[include printer_monitor.cfg]


