# This file contains pin mappings for the BTT SKR Mini E3 V3.0
# on an Ender 3 V2. To use this config, the firmware should be
# compiled for the STM32G0B1 with an "8KiB bootloader" and
# USB communication (on PA11/PA12).

# Flash this firmware by copying "out/klipper.bin" to a SD card
# (as "firmware.bin") and restarting the SKR Mini E3 with that
# SD card inserted.

# See docs/Config_Reference.md for a description of parameters.

[virtual_sdcard]
path: ~/printer_data/gcodes
[respond]
[display_status]

[pause_resume]


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  G91                ; Set to relative positioning
  G1 X-2 Y-2 E-1 F300  ; Retract and move nozzle slightly
  G1 Z20 F3000       ; Raise nozzle by 20mm
  G90                ; Set to absolute positioning
  G1 X240 Y230           ; Move nozzle to the far right end of the X-axis (confirm the max X value for your printer)
  TURN_OFF_HEATERS
  #POWER_OFF_EXHAUST
  CANCEL_PRINT_BASE

[gcode_macro PRINT_START]
gcode:
    # Initialize and set temperatures to prevent oozing
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
     # Start heating the bed and nozzle without waiting
    M140 S{BED_TEMP}  ; Start heating the bed
    G28
    SYNC_SPOOL        ; Auto-detect material type + PA from Spoolman
    #OPEN_WINDOW
    G4 P5000  ; Wait 5 seconds for the window to fully open
    M104 S{160} ; Start heating the nozzle  
    #ATTACH_DUCTS
    
    

    
    #G4 P65000  ; Wait 65 seconds for the ducts to fully attach
    #M109 S{160}
    #NOZZLE_WIPE
    
    
    
    M190 S{BED_TEMP} ; Wait for bed to reach initial layer temperature
    BED_MESH_CALIBRATE PROFILE=print METHOD=rapid_scan ADAPTIVE=1 ; Create Bed Mesh METHOD=rapid_scan

    G90
    G1 Z10 F3000                  ; Raise to safe travel height
    G1 X241 F6000              ; Move above wipe start position (right side, past brush edge)



    M109 S{EXTRUDER_TEMP} ; Wait for nozzle to reach initial layer temperature

    NOZZLE_WIPE

    # Set positioning and extrusion modes
    G90 ; Use absolute coordinates
    M83 ; Set extruder to relative mode

    # Positioning for start of the print
    G1 Z10 F240 ; Move Z to 10mm to clear the bed
    G1 X0 Y10 F3000 ; Move to starting position

    

    # Prime the nozzle
    G1 Z0.28 F240 ; Lower to just above the bed
    G92 E0 ; Reset extruder
    G1 Y140 E10 F1500 ; Extrude 10mm of filament while moving to Y140
    G1 X0.3 F5000 ; Small move in X to reduce stringing
    G92 E0 ; Reset extruder again
    G1 Y10 E10 F1200 ; Extrude 10mm of filament while moving back to Y10
    G1 X1.3 ; Move slightly to the right (adjust the value as needed)
    G92 E0 ; Reset extruder

    #POWER_ON_EXHAUST

    # Ensure all settings are reset and ready
    G90 ; Confirm absolute positioning
    SET_GCODE_OFFSET Z=0.0 ; Reset any G-code Z offset
    G1 Z5 F3000 ; Position nozzle near the bed
    G1 Z0.15 F300 ; Move nozzle very close to the bed for starting print

    



[gcode_macro PRINT_END]
gcode:
    M140 S0
    M104 S0
    M106 S0
    G91
    G1 X-2 Y-2 E-1 F300
    G1 Z20 F3000
    G90
    G1 X240 Y230
    M400
    BED_MESH_CLEAR
    BED_MESH_PROFILE REMOVE=print  ; Remove per-print profile cleanly
    #POWER_OFF_EXHAUST
    #DETACH_DUCTS
    #G4 P65000  ; Wait 65 seconds for the ducts to fully detach
    #CLOSE_WINDOW
    G4 P5000 ; Wait 5 seconds for window to close
    M84                              ; Disable steppers
    SET_IDLE_TIMEOUT TIMEOUT=30      ; Idle fires in 30s → delayed_printer_off

    
    
    

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

######################################################################
# Filament Manager (Spoolman Integration)
######################################################################
# Spoolman tracks spool inventory (brand, color, weight remaining).
# Select the active spool in Fluidd — usage is tracked automatically.
# SYNC_SPOOL reads the active spool's material from Spoolman and
# auto-sets FILAMENT_VARS (type + pressure advance). Called by PRINT_START.
# Manual use: FILAMENT_LOAD TYPE=PLA  or just FILAMENT_LOAD (uses current type)

# Requires gcode_shell_command extension:
#   cd ~/klipper && wget -O klippy/extras/gcode_shell_command.py \
#     https://raw.githubusercontent.com/dw-0/kiauh/master/resources/gcode_shell_command.py
#   sudo systemctl restart klipper

[gcode_shell_command sync_spool]
command: python3 /home/oleh/printer_data/config/sync_spool.py
timeout: 10
verbose: True

[gcode_shell_command sync_spool_and_unload]
command: python3 /home/oleh/printer_data/config/sync_spool.py --unload
timeout: 10
verbose: True

[gcode_shell_command sync_spool_and_load]
command: python3 /home/oleh/printer_data/config/sync_spool.py --load
timeout: 10
verbose: True

[gcode_macro SYNC_SPOOL]
description: Sync active Spoolman spool material → FILAMENT_VARS (type + PA)
gcode:
  RESPOND MSG="Syncing spool from Spoolman..."
  RUN_SHELL_COMMAND CMD=sync_spool

[gcode_macro FILAMENT_VARS]
description: Temperature and PA presets per material type
variable_type: "PLA+"
variable_temps: { "PLA": 210, "PLA+": 215, "PETG": 240, "ABS": 250, "TPU": 230 }
variable_pa: { "PLA": 0.035, "PLA+": 0.04, "PETG": 0.06, "ABS": 0.03, "TPU": 0.0 }
gcode:
  {% set ft = printer["gcode_macro FILAMENT_VARS"].type %}
  {% set temps = printer["gcode_macro FILAMENT_VARS"].temps %}
  {% set pa = printer["gcode_macro FILAMENT_VARS"].pa %}
  {action_respond_info("Filament: %s | Temp: %d°C | PA: %.2f" % (ft, temps[ft], pa[ft]))}

[gcode_macro SET_FILAMENT]
description: Set material type and apply PA. Usage: SET_FILAMENT TYPE=PETG
gcode:
  {% set ftype = params.TYPE|default("")|upper %}
  {% set temps = printer["gcode_macro FILAMENT_VARS"].temps %}
  {% if ftype == "" %}
    {action_respond_info("Current: %s. Usage: SET_FILAMENT TYPE=PLA (PLA, PLA+, PETG, ABS, TPU)" % printer["gcode_macro FILAMENT_VARS"].type)}
  {% elif ftype not in temps %}
    {action_respond_info("Unknown type '%s'. Supported: PLA, PLA+, PETG, ABS, TPU" % ftype)}
  {% else %}
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=type VALUE="'{ftype}'"
    {% set pa = printer["gcode_macro FILAMENT_VARS"].pa %}
    SET_PRESSURE_ADVANCE ADVANCE={pa[ftype]}
    RESPOND MSG="Filament: {ftype} | Temp: {temps[ftype]}°C | PA: {pa[ftype]}"
  {% endif %}

[gcode_macro FILAMENT_LOAD]
description: Heat and load filament. Usage: FILAMENT_LOAD TYPE=PLA
gcode:
  {% set ftype = params.TYPE|default("")|upper %}
  {% set temps = printer["gcode_macro FILAMENT_VARS"].temps %}
  {% if ftype != "" and ftype in temps %}
    SET_FILAMENT TYPE={ftype}
  {% elif ftype != "" %}
    {action_respond_info("Unknown type '%s'. Supported: PLA, PLA+, PETG, ABS, TPU" % ftype)}
  {% endif %}
  {% set ft = ftype if (ftype != "" and ftype in temps) else printer["gcode_macro FILAMENT_VARS"].type %}
  {% set temp = temps[ft] %}
  RESPOND MSG="Loading {ft} at {temp}°C..."
  G28
  G91
  G1 Z10
  M109 T0 S{temp}
  M83                   # Put the extruder into relative mode
  G92 E0.0              # Reset the extruder so that it thinks it is at position zero
  G1 E50 F350           # Move the extruder forward 50mm (direct drive)
  G92 E0.0              # Reset the extruder again
  M82                   # Put the extruder back into absolute mode.
  RESPOND MSG="{ft} loaded. Select the spool in Fluidd to track usage."

[gcode_macro FILAMENT_UNLOAD]
description: Heat and unload filament. Usage: FILAMENT_UNLOAD [TYPE=ABS]
gcode:
  {% set ftype = params.TYPE|default("")|upper %}
  {% if ftype != "" %}
    _DO_FILAMENT_UNLOAD TYPE={ftype}
  {% else %}
    RESPOND MSG="Syncing spool from Spoolman..."
    RUN_SHELL_COMMAND CMD=sync_spool_and_unload
  {% endif %}

[gcode_macro _DO_FILAMENT_UNLOAD]
gcode:
  {% set ftype = params.TYPE|default("")|upper %}
  {% set temps = printer["gcode_macro FILAMENT_VARS"].temps %}
  {% if ftype != "" and ftype in temps %}
    SET_FILAMENT TYPE={ftype}
  {% elif ftype != "" %}
    {action_respond_info("Unknown type '%s'. Supported: PLA, PLA+, PETG, ABS, TPU" % ftype)}
  {% endif %}
  {% set ft = ftype if (ftype != "" and ftype in temps) else printer["gcode_macro FILAMENT_VARS"].type %}
  {% set temp = temps[ft] %}
  RESPOND MSG="Unloading {ft} at {temp}°C..."
  G28
  G91
  G1 Z10
  M109 T0 S{temp}
  M83                   # Put the extruder into relative mode
  G92 E0.0              # Reset the extruder so that it thinks it is at position zero
  G1 E3 F350            # Move forward 3 mm to "catch" melted filament
  G1 E-50 F350          # Retract 50mm (direct drive)
  G92 E0.0              # Reset the extruder again
  M82                   # Put the extruder back into absolute mode.
  RESPOND MSG="{ft} unloaded."

[gcode_macro POWER_OFF_PRINTER]
gcode:
  {action_call_remote_method(
    "set_device_power", device="printerswitch", state="off"
  )}

[gcode_macro POWER_OFF_EXHAUST]
gcode:
  {action_call_remote_method(
    "set_device_power", device="exhaustswitch", state="off"
  )}

[gcode_macro POWER_ON_EXHAUST]
gcode:
  {action_call_remote_method(
    "set_device_power", device="exhaustswitch", state="on"
  )}

[gcode_macro OPEN_WINDOW]
gcode:
  {action_call_remote_method(
    "set_device_power", device="openwindow", state="on"
  )}

[gcode_macro CLOSE_WINDOW]
gcode:
  {action_call_remote_method(
    "set_device_power", device="closewindow", state="on"
  )}

[gcode_macro ATTACH_DUCTS]
gcode:
  {action_call_remote_method(
    "set_device_power", device="attachducts", state="on"
  )}

[gcode_macro DETACH_DUCTS]
gcode:
  {action_call_remote_method(
    "set_device_power", device="detachducts", state="on"
  )}

[gcode_macro NOZZLE_WIPE]
description: Zigzag wipe across brush at X228-241 Y0–31 Z2. Requires homed axes and nozzle >= 140C.
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("NOZZLE_WIPE: Printer not homed, aborting.")}
  {% elif printer.extruder.temperature < 140 %}
    {action_respond_info("NOZZLE_WIPE: Nozzle too cold (%.1f°C). Need at least 140°C." % printer.extruder.temperature)}
  {% else %}
    G90
    M106 S255                     ; Part fan 100% to cool ooze for wipe
    G1 Z10 F3000                  ; Raise to safe travel height
    G1 X241 Y0 F6000              ; Move above wipe start position (right side, past brush edge)
    G1 Z4 F1000                   ; Lower to brush height
    ; --- Serpentine passes: overshoot brush bounds by ~3mm each direction ---
    {% for pass in range(3) %}
      G1 X228 Y7 F4000            ; Diagonal wipe to left (past brush)
      G1 X241 Y14 F4000           ; Diagonal wipe to right (past brush)
      G1 X228 Y21 F4000           ; Diagonal wipe to left (past brush)
      G1 X241 Y31 F4000           ; Diagonal wipe to right (past brush in Y)
      G1 X228 Y21 F4000           ; Diagonal return left
      G1 X241 Y14 F4000           ; Diagonal return right
      G1 X228 Y7 F4000            ; Diagonal return left
      G1 X241 Y0 F4000            ; Diagonal return right
    {% endfor %}
    ; --- Final straight wipes along center for a clean finish ---
    G1 X234.5 Y0 F4000            ; Center on brush
    {% for i in range(3) %}
      G1 Y31 F4000                ; Straight wipe forward (past brush)
      G1 Y0 F4000                 ; Straight wipe back
    {% endfor %}
    G1 Z10 F3000                  ; Raise when done
    M106 S0                       ; Fan off after wipe
  {% endif %}

[gcode_macro ENCLOSURE_VARS]
description: Holds enclosure sensor values from Moonraker MQTT sensors
variable_temperature: 0
variable_humidity: 0
variable_window_open: 0
variable_ducts_attached: 0
gcode:
  {action_respond_info("Enclosure: %.1f°F, %.1f%% RH | Window: %s | Ducts: %s" %
    (printer["gcode_macro ENCLOSURE_VARS"].temperature,
     printer["gcode_macro ENCLOSURE_VARS"].humidity,
     "Open" if printer["gcode_macro ENCLOSURE_VARS"].window_open else "Closed",
     "Attached" if printer["gcode_macro ENCLOSURE_VARS"].ducts_attached else "Detached"))}

[gcode_macro FILAMENT_DRY]
description: Heat bed to dry filament in enclosure. Use HOURS=8 (default) to set duration (1-12).
variable_is_drying: 0
gcode:
  {% set hours = params.HOURS|default(8)|float %}
  {% if hours < 1 or hours > 12 %}
    {action_respond_info("HOURS must be between 1 and 12. Got: %.1f" % hours)}
  {% else %}
    {% set duration_sec = (hours * 3600)|int %}
    SET_GCODE_VARIABLE MACRO=FILAMENT_DRY VARIABLE=is_drying VALUE=1
    RESPOND MSG="Filament drying: bed to 100C for {hours} hours."
    # Home and park head at top right, high up
    G28
    G90
    G1 X245 Y230 F3000
    G1 Z245 F1000
    # Turn on part fan to circulate air
    M106 S255
    # Extend idle timeout so Klipper won't kill heaters
    SET_IDLE_TIMEOUT TIMEOUT={duration_sec + 600}
    # Heat the bed
    M140 S100
    # Schedule auto-shutoff
    UPDATE_DELAYED_GCODE ID=_filament_dry_end DURATION={duration_sec}
    RESPOND MSG="Drying will end automatically in {hours} hours. Use FILAMENT_DRY_STOP to cancel."
  {% endif %}

[gcode_macro FILAMENT_DRY_STOP]
description: Stop filament drying early
gcode:
  {% if printer["gcode_macro FILAMENT_DRY"].is_drying == 1 %}
    UPDATE_DELAYED_GCODE ID=_filament_dry_end DURATION=0
    M140 S0
    M106 S0
    SET_GCODE_VARIABLE MACRO=FILAMENT_DRY VARIABLE=is_drying VALUE=0
    SET_IDLE_TIMEOUT TIMEOUT=900
    RESPOND MSG="Filament drying stopped."
  {% else %}
    RESPOND MSG="Filament drying is not active."
  {% endif %}

[delayed_gcode _filament_dry_end]
initial_duration: 0
gcode:
  M140 S0
  M106 S0
  SET_GCODE_VARIABLE MACRO=FILAMENT_DRY VARIABLE=is_drying VALUE=0
  SET_IDLE_TIMEOUT TIMEOUT=900
  RESPOND MSG="Filament drying complete. Bed heater off."

[delayed_gcode delayed_printer_off]
initial_duration: 0.
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    POWER_OFF_PRINTER
  {% endif %}

[delayed_gcode startup_gcode]
initial_duration: .1
gcode:
  G28
  #SCREWS_TILT_CALCULATE

[idle_timeout]
gcode:
  {% if printer["gcode_macro FILAMENT_DRY"].is_drying == 0 %}
    M84
    TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=5
  {% else %}
    M84
  {% endif %}
timeout: 900

